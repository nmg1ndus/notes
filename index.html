<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vyut Notes</title>

<!-- Primary Meta Tags -->
<meta name="title" content="Vyut Notes - Smart Learning Platform">
<meta name="description" content="Access interactive notes, study materials, and practical tools for your classes. A modern platform for all subjects.">

<!-- Open Graph / WhatsApp / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://nmg1ndus.github.io/notes/">
<meta property="og:title" content="Vyut Notes - Smart Learning Platform">
<meta property="og:description" content="Access interactive notes, study materials, and practical tools for your classes. A modern platform for all subjects.">
<!-- इमेज का पूरा URL देना ज़रूरी है -->
<meta property="og:image" content="https://nmg1ndus.github.io/notes/banner.jpg">

<!-- Twitter / X -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://nmg1ndus.github.io/notes/">
<meta property="twitter:title" content="Vyut Notes - Smart Learning Platform">
<meta property="twitter:description" content="Access interactive notes, study materials, and practical tools for your classes. A modern platform for all subjects.">
<meta property="twitter:image" content="https://nmg1ndus.github.io/notes/banner.jpg">

<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Fira+Code&family=Merriweather:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"> 
</head>
<body>
  
<header class="top">
  <!-- href="/" की जगह href="#/" कर दिया गया है -->
  <a href="#/" class="brand">Computer Notes</a>
  <div class="lang" role="group" aria-label="Notes language">
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="hi">Hindi</button>
  </div>
</header>
<main id="app" aria-live="polite"></main>

<div id="backdrop" hidden></div>
<aside id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
  <header class="sheet-head">
    <button type="button" id="sheet-close" aria-label="Close">&#10005;</button>
    <h3 id="sheet-title">Algorithm</h3>
  </header>
  <div id="sheet-body"></div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<!-- '/' हटा दिया गया है -->
<script src="app.js"></script> 
</body>
</html>
